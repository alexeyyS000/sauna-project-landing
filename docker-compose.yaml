services:
  app:
    restart: unless-stopped
    build:
      context: .
      target: app
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  postgres:
    restart: unless-stopped
    image: postgres:15-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups/initial.sql:/docker-entrypoint-initdb.d/10-initial.sql:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6

  nginx:
    restart: unless-stopped
    build:
      context: .
      target: nginx
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set minio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc ready minio; do sleep 2; done
        mc mb --ignore-existing "minio/$${AWS_STORAGE_BUCKET_NAME:-media}"
        mc anonymous set download "minio/$${AWS_STORAGE_BUCKET_NAME:-media}"

  migrate:
    build:
      context: .
      target: app
    restart: "no"
    command: sh -ec 'python manage.py migrate && python manage.py create_default_superuser'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully


volumes:
  postgres-data:
  minio-data:
